android.useAndroidX=true
# AGP 9's new DSL is incompatible with the standalone Kotlin plugin (same setting the
# local Flutter/AGP 9.1 projects use).
android.newDsl=false
android.builtInKotlin=false
# The verification modules stage the skill's examples into their build dir through a Sync
# task, so the Android source-set API has to accept a Provider. We wire the task dependency
# manually below, which is what AGP cannot infer for us.
android.sourceset.disallowProvider=false
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
