name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layout:
    name: layout + portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo layout, manifests, relative refs
        run: ./tests/plugin_layout_test.sh

  scanner:
    name: scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python3 -m py_compile skills/material-3-frosted/scripts/scan_ui.py

      - name: Fixture — legacy app must produce findings
        run: |
          set -e
          F=/tmp/fixture
          mkdir -p "$F/app/src/main/res/values"
          cat > "$F/settings.gradle.kts" <<'EOF'
          include(":app")
          EOF
          cat > "$F/app/build.gradle.kts" <<'EOF'
          android {
              compileSdk = 33
              defaultConfig { targetSdk = 33; minSdk = 24 }
              dependencies { implementation("com.google.android.material:material:1.9.0") }
          }
          EOF
          cat > "$F/app/src/main/res/values/themes.xml" <<'EOF'
          <resources>
              <style name="T" parent="Theme.MaterialComponents.DayNight" />
          </resources>
          EOF
          OUT="$(python3 skills/material-3-frosted/scripts/scan_ui.py "$F" --format text)"
          echo "$OUT"
          echo "$OUT" | grep -q "CRITICAL" || { echo "expected a critical finding"; exit 1; }
          if python3 skills/material-3-frosted/scripts/scan_ui.py "$F" --fail-on critical >/dev/null; then
            echo "expected --fail-on critical to exit 2"; exit 1
          fi

      - name: JSON output is valid
        run: |
          python3 skills/material-3-frosted/scripts/scan_ui.py . --format json \
            | python3 -c "import json,sys; json.load(sys.stdin); print('json ok')"

  compile:
    name: examples compile (real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # ubuntu-latest already ships the Android SDK with ANDROID_HOME set, so this job does
      # not need a setup-android action (and that action currently fails on the image's
      # cmdline-tools when it tries to install `tools`). Accept the licences here; AGP then
      # downloads whichever platform `compileSdk` asks for.
      - name: Accept Android SDK licences
        run: |
          set -uo pipefail
          SM="$(command -v sdkmanager || echo "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # Best effort: pre-install what AGP will need. If the package id differs on this
          # image, AGP's own resolution still gets its chance below.
          "$SM" --install "platforms;android-37.0" > /dev/null 2>&1 \
            || echo "pre-install skipped; letting AGP resolve the platform"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      # The real check: every shipped example, against the real artifacts, on both the
      # expressive (material3 1.5.0-beta01) and stable (1.4.0) paths. This is what catches
      # API errors that parsing cannot — e.g. a Haze function that only exists on `main`.
      - name: Compile examples
        working-directory: verify
        run: |
          set -o pipefail
          ./gradlew --no-daemon :expressive:compileDebugKotlin :stable:compileDebugKotlin

      # A previous iteration of this harness passed while compiling zero files, because a
      # source path pointed at a directory that did not exist. Exit status alone is not
      # evidence; count the produced classes.
      - name: Prove the harness compiled something
        run: |
          set -e
          for m in expressive stable; do
            n=$(find "verify/$m/build" -name '*.class' \
                  -not -name 'R.class' -not -name 'R$*.class' -not -name 'BuildConfig.class' | wc -l)
            echo "$m: $n classes"
            if [ "$n" -lt 20 ]; then
              echo "FAIL: $m produced $n classes — the harness compiled nothing"
              exit 1
            fi
          done

  react-native:
    name: react-native examples (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The examples are typechecked against the real expo-blur and
      # expo-glass-effect typings, not against hand-written stubs.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prove the harness typechecked something
        run: |
          set -e
          n=$(find examples -name '*.tsx' -o -name '*.ts' | wc -l)
          echo "example files: $n"
          if [ "$n" -lt 4 ]; then
            echo "FAIL: only $n example files present"
            exit 1
          fi

  swiftui:
    name: swiftui example (typecheck)
    # SwiftUI can only be typechecked against Apple's SDK, so this job needs a
    # macOS runner. It is the only way to verify the iOS example at all.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck against the iOS simulator SDK
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "SDK: $SDK"
          xcrun swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios17.0-simulator \
            skills/material-3-frosted/assets/examples/ios-swiftui/GlassChrome.swift
          echo "swift typecheck ok"

  flutter:
    name: flutter examples (analyze + run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verify/flutter
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `channel: stable`: an example that only compiles on the SDK the
      # skill was verified against is not a verified example. Bump this together
      # with the version quoted in references/flutter.md.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Stage the skill's examples
        run: ./tool/sync_examples.sh

      - name: Resolve dependencies
        run: flutter pub get

      # --fatal-infos: the examples ship to users, so a lint hint is a defect.
      - name: Analyze
        run: flutter analyze --fatal-infos

      # Analyze proves the APIs exist. The tests prove the widgets build, lay
      # out and respond — a widget can typecheck and still throw on first paint.
      - name: Run widget tests
        run: flutter test

      - name: Prove the harness analysed something
        run: |
          set -e
          n=$(find lib/examples -name '*.dart' | wc -l)
          echo "staged example files: $n"
          if [ "$n" -lt 5 ]; then
            echo "FAIL: only $n example files staged — analyze checked almost nothing"
            exit 1
          fi

  # Fast pre-check with no Android SDK. `compile` below is the authoritative one; this job
  # exists so a syntax error fails in ~30 s instead of after the Gradle download.
  kotlin:
    name: kotlin syntax pre-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download kotlinc
        run: |
          curl -sL -o kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlin.zip

      # The examples are copy-adapt code compiled without the Android SDK, so
      # "unresolved reference" and everything downstream of it is expected. What must
      # NOT appear is a genuine syntax error. The positive control at the end proves
      # the filter still catches one.
      - name: Fail on anything that is not an unresolved-reference consequence
        run: |
          set -uo pipefail
          KOTLINC=kotlinc/bin/kotlinc

          # Case-insensitive: the compiler emits "cannot infer", not "Cannot infer".
          CONSEQUENCE='unresolved reference|cannot access|cannot infer|not enough information|argument type mismatch|receiver type mismatch|type mismatch|none of the following|no value passed|too many arguments|cannot find|cannot resolve|compile-time constant|overload resolution|cannot be applied|unsupported|conflicting|cannot be called|does not have a companion|is not abstract|does not implement|must be initialized|val cannot be reassigned|is not a function|has no effect'

          check() {
            local file="$1" out bad
            out="$($KOTLINC "$file" -d /tmp/out 2>&1 || true)"
            bad="$(printf '%s\n' "$out" | grep -iE ': error: ' | grep -ivE "$CONSEQUENCE" || true)"
            if [ -n "$bad" ]; then
              printf 'UNEXPECTED COMPILER ERROR in %s:\n%s\n' "$file" "$bad"
              return 1
            fi
            return 0
          }

          status=0
          for f in skills/material-3-frosted/assets/examples/*.kt; do
            check "$f" || status=1
          done

          # Positive control: a real syntax error must still be caught, otherwise this
          # filter has become a no-op that passes everything.
          cp skills/material-3-frosted/assets/examples/FrostedTheme.kt /tmp/control.kt
          printf '\nfun broken( {\n' >> /tmp/control.kt
          if check /tmp/control.kt; then
            echo 'SELF-TEST FAILED: a genuine syntax error was not detected — the filter is too broad'
            status=1
          else
            echo 'self-test ok: genuine syntax error detected'
          fi

          exit $status
